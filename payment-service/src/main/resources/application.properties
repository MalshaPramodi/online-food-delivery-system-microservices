server.port=9004
spring.application.name=payment-service

spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5436/payment_db}
spring.datasource.username=${PAYMENT_DB_USERNAME:postgres}
spring.datasource.password=${PAYMENT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

customer.payment-methods.url=${CUSTOMER_PAYMENT_METHODS_URL:http://customer-service/customers/}
payment.credit-card-validation.enabled=false
order.status-update.url=${ORDER_STATUS_UPDATE_URL:http://order-service:9001/order/}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.currency=${STRIPE_CURRENCY:usd}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/checkout/success?session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/checkout/cancel}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.payment-completed=payment-completed
