server.port=9004
spring.application.name=payment-service

spring.datasource.url=${PAYMENT_DB_URL:jdbc:postgresql://localhost:5436/payment_db}
spring.datasource.username=${PAYMENT_DB_USERNAME:postgres}
spring.datasource.password=${PAYMENT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

customer.payment-methods.url=http://customer-service/customers/
payment.credit-card-validation.enabled=false
