spring.application.name=restaurant-service
server.port=9002

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${RESTAURANT_DB_URL:jdbc:postgresql://localhost:5433/restaurant_db}
spring.datasource.username=${RESTAURANT_DB_USERNAME:postgres}
spring.datasource.password=${RESTAURANT_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
