services:
  restaurant-db:
    image: postgres:16
    container_name: restaurant-db
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - restaurant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:16
    container_name: customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16
    container_name: notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  service-discovery:
    build:
      context: ./service-discovery
    container_name: service-discovery
    ports:
      - "8761:8761"
    depends_on:
      - kafka

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "9000:9000"
    environment:
      EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    depends_on:
      - service-discovery

  restaurant-service:
    build:
      context: ./restaurant-service
    container_name: restaurant-service
    ports:
      - "9002:9002"
    environment:
      EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: restaurant-service
      RESTAURANT_DB_URL: jdbc:postgresql://restaurant-db:5432/restaurant_db
      RESTAURANT_DB_USERNAME: postgres
      RESTAURANT_DB_PASSWORD: postgres
    depends_on:
      restaurant-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  customer-service:
    build:
      context: ./customer-service
    container_name: customer-service
    ports:
      - "9003:9003"
    environment:
      EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: customer-service
      CUSTOMER_DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      CUSTOMER_DB_USERNAME: postgres
      CUSTOMER_DB_PASSWORD: postgres
    depends_on:
      customer-db:
        condition: service_healthy
      service-discovery:
        condition: service_started

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "9001:9001"
    environment:
      EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/order_db
      ORDER_DB_USERNAME: postgres
      ORDER_DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RESTAURANT_SERVICE_URL: http://restaurant-service:9002/restaurants/
      PAYMENT_SERVICE_URL: http://payment-service:9004/payment/save
      CUSTOMER_SERVICE_URL: http://customer-service:9003/customers/
      PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-simulated}
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
      service-discovery:
        condition: service_started
      restaurant-service:
        condition: service_started
      customer-service:
        condition: service_started
      payment-service:
        condition: service_started

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "9004:9004"
    environment:
      EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: payment-service
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      PAYMENT_DB_USERNAME: postgres
      PAYMENT_DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CUSTOMER_PAYMENT_METHODS_URL: http://customer-service:9003/customers/
      ORDER_STATUS_UPDATE_URL: http://order-service:9001/order/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/checkout/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/checkout/cancel}
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
      service-discovery:
        condition: service_started
      customer-service:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "9005:9005"
    environment:
      EUREKA_DEFAULT_ZONE: http://service-discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      NOTIFICATION_DB_USERNAME: postgres
      NOTIFICATION_DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CUSTOMER_SERVICE_URL: http://customer-service:9003/customers/
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-no-reply@food-delivery.local}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_started
      service-discovery:
        condition: service_started
      customer-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  restaurant_db_data:
  customer_db_data:
  order_db_data:
  payment_db_data:
  notification_db_data:
  kafka_data:
