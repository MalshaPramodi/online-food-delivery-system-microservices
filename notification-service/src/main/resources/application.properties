spring.application.name=notification-service
server.port=9005

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5437/notification_db}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:postgres}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topic.order-created=order-created
app.kafka.topic.payment-completed=payment-completed

customer.microservice.url=${CUSTOMER_SERVICE_URL:http://customer-service/customers/}

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@food-delivery.local}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
