spring.application.name=notification-service
server.port=9005

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5437/notification_db}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:postgres}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true