server.port=9001
spring.application.name=order-service

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5435/order_db}
spring.datasource.username=${ORDER_DB_USERNAME:postgres}
spring.datasource.password=${ORDER_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

restaurant.microservice.url=${RESTAURANT_SERVICE_URL:http://restaurant-service/restaurants/}
payment.microservice.url=${PAYMENT_SERVICE_URL:http://payment-service/payment/save}
customer.microservice.url=${CUSTOMER_SERVICE_URL:http://customer-service/customers/}
payment.gateway.mode=${PAYMENT_GATEWAY_MODE:simulated}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.order-created=order-created

