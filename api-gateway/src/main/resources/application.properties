spring.application.name=api-gateway
server.port=9000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webmvc.routes[0].id=restaurant-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://restaurant-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/restaurants/**

spring.cloud.gateway.server.webmvc.routes[1].id=customer-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/customers/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/payment/**

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,gateway
