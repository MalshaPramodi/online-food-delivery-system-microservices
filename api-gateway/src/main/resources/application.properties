spring.application.name=api-gateway
server.port=9000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webmvc.routes[0].id=restaurant-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://restaurant-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/restaurants/**

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,gateway
